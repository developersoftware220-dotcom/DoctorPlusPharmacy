<style>
:root{--bg:#f3f6f9;--card:#fff;--tx:#1d2733;--mu:#6b7785;--pr:#0f8f6f;--pd:#0a6b53;--bd:#e1e7ee;--rd:#d64545;--or:#e8890c}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Arial;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
aside{width:210px;background:#0d2a2a;color:#cfe;padding:12px 8px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
aside h1{font-size:17px;color:#fff;margin:6px 8px 14px}aside button{display:block;width:100%;text-align:left;background:none;border:0;color:#cfe;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:2px}
aside button:hover{background:#17403f}aside button.on{background:var(--pr);color:#fff}
main{flex:1;padding:18px;min-width:0}h2{margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}.stat b{display:block;font-size:22px;margin-top:4px}.stat span{color:var(--mu)}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}th{background:#f7f9fb;font-size:12px;color:var(--mu);text-transform:uppercase}
.tw{overflow-x:auto}input,select,textarea{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;width:100%;background:#fff}
button.b{background:var(--pr);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}button.b:hover{background:var(--pd)}
button.g{background:#e8eef3;color:var(--tx)}button.r{background:var(--rd)}button.s{padding:4px 9px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row>*{flex:1;min-width:120px}.row>button{flex:0 0 auto}
.pos{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}@media(max-width:850px){body{display:block}aside{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap}aside h1{width:100%}aside button{width:auto}.pos{grid-template-columns:1fr}}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:#e8eef3}.red{background:#fde4e4;color:var(--rd)}.org{background:#fdf0dc;color:var(--or)}.grn{background:#dcf5ea;color:var(--pd)}
#md{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}#md>div{background:#fff;border-radius:12px;padding:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
#ts{position:fixed;bottom:16px;right:16px;background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99}
.x{float:right;padding:4px 10px;font-size:16px;margin:-6px -6px 0 8px}label{font-size:12px;color:var(--mu);display:block;margin:6px 0 2px}.tot{font-size:15px}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .big{font-size:19px;font-weight:700;color:var(--pd)}
#lk{position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#0a6b53,#0f8f6f);display:none;align-items:center;justify-content:center;padding:16px;font-family:Arial,sans-serif}
#lk .bx{background:#fff;border-radius:14px;padding:28px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#lk h2{margin:0 0 4px;color:#0a6b53;font-size:22px}#lk p{margin:0 0 16px;color:#6b7785;font-size:13px}
#lk input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #e1e7ee;border-radius:8px;font-size:16px;text-align:center}
#lk button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:#0f8f6f;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
#lk .er{color:#d64545;font-size:13px;margin-top:10px;min-height:16px}
#sp{position:fixed;inset:0;z-index:100000;background:#0a3d7a;background:linear-gradient(160deg,#0b3a78,#0a6b53);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#sp img{width:170px;height:170px;border-radius:36px;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:spz 1.4s ease-in-out infinite alternate}
#sp .ld{width:150px;height:5px;background:rgba(255,255,255,.25);border-radius:5px;margin-top:28px;overflow:hidden}
#sp .ld i{display:block;height:100%;width:0;background:#4be3a5;border-radius:5px;animation:spl 2s linear forwards}
#sp small{color:#fff;margin-top:12px;font:13px Arial;opacity:.85}
@keyframes spz{from{transform:scale(.95)}to{transform:scale(1.05)}}@keyframes spl{to{width:100%}}
#lk .lg{width:90px;height:90px;border-radius:20px;margin-bottom:10px}

 const items=cart.map(x=>{const m=med(x.id),o=m.stock;m.stock-=x.qty;addHist(m,o,-x.qty,"Sale "+inv);return{medicineId:m.id,name:m.name,qty:x.qty,quantity:x.qty,price:m.salePrice,purchasePrice:m.purchasePrice,total:x.qty*m.salePrice}});

 M(`<h2>Settings & Backup</h2><div class="card"><h3>Pharmacy Profile</h3><div class="row"><div><label>Owner</label><input id="s_owner" value="${E(s.owner)}"></div></div><div class="row"><div><label>Phone</label><input id="s_phone" value="${E(s.phone)}"></div><div><label>Address</label><input id="s_address" value="${E(s.address)}"></div></div>
 <div class="row"><div><label>Currency</label><input id="s_currency" value="${E(s.currency)}"></div><div><label>Tax %</label><input id="s_tax" type="number" value="${s.tax}"></div><div><label>Low stock default</label><input id="s_lowStock" type="number" value="${s.lowStock}"></div><div><label>Expiry alert (days)</label><input id="s_expiryDays" type="number" value="${s.expiryDays}"></div></div><label>Invoice footer</label><input id="s_footer" value="${E(s.footer)}"><div class="row" style="margin-top:12px"><button class="b" onclick="saveSet()">Save Settings</button></div></div>
 <div class="card"><h3>💾 Backup & Restore</h3><p style="color:var(--mu)">Last backup: ${s.lastBackup?new Date(s.lastBackup).toLocaleString():"Never"}. A snapshot is saved automatically every day (last 7 days kept). Please download a backup file at least once a week.</p>
 <div class="row"><button class="b" onclick="backup()">⬇️ Download Backup</button><button class="b g" onclick="$('rf2').click()">⬆️ Restore from File</button><input type="file" id="rf2" accept=".json" hidden onchange="restore(this.files[0])"></div>
 <label>Auto snapshots (browser mein)</label>${tbl(["Date",""],snaps.map(k=>`<tr><td>${k.slice(8)}</td><td><button class="b s g" onclick="snap('${k}')">Restore</button></td></tr>`).join(""))}</div>
 <div class="card"><h3>⚠️ Danger Zone</h3><div class="row"><button class="b r" onclick="wipe('sales')">Clear sales history</button><button class="b r" onclick="wipe('all')">Delete all data</button></div></div>`)};
function saveSet(){["owner","phone","address","currency","footer"].forEach(k=>S()[k]=$("s_"+k).value.trim());["tax","lowStock","expiryDays"].forEach(k=>S()[k]=N($("s_"+k).value));save();go("settings");toast("Settings saved ✅")}
function backup(){S().lastBackup=new Date().toISOString();save();dl(`${S().name.replace(/\s+/g,"_")}_backup_${today()}.json`,JSON.stringify(db),"application/json");toast("Backup downloaded ✅")}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.medicines))throw 0;if(!confirm("Your current data will be replaced. Continue?"))return;
 if(confirm("Download a backup of your current data first?"))backup();db=norm(d);save();go("settings");toast("Restored ✅")}catch(e){toast("Invalid backup file")}};r.readAsText(f)}
function snap(k){if(confirm("Restore data from this day?")){db=norm(JSON.parse(localStorage.getItem(k)));save();go("settings");toast("Restored ✅")}}
function wipe(w){if(!confirm("A backup will be downloaded first. Continue?"))return;backup();if(w=="all"){const s=db.settings;db=emptyDB();db.settings=s}else db.sales=[];save();go("settings")}
addEventListener("beforeunload",save);
go("dashboard");
</script></body></html>
